# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'V*'

jobs:
  build:
    name: Build with Maven
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # A version with a pre-release part (3.0.0-beta.1, 3.0.0-rc.1) is pushed under its exact
      # tag only. :<major.minor> and :latest are what general deployment pulls, so they move
      # only for a final version (3.0.0). A manual run has no tag to take a version from, so it
      # is refused rather than pushing an image named after a branch.
      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Release images are built from a tag (v3.0.0, v3.0.0-beta.1); $GITHUB_REF is not one."
            exit 1
          fi
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          VERSION=${VERSION#V}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "Pre-release $VERSION: pushing :$VERSION only"
            echo "extra_tags=" >> $GITHUB_OUTPUT
          else
            echo "extra_tags=$(echo $VERSION | cut -d. -f1,2),latest" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'

      # The image is tagged from the git tag, the jar from the pom; a tag on a pom that says
      # something else would publish an image whose own version disagrees with its name.
      - name: Tag matches the pom version
        run: |
          POM_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$POM_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} does not match the pom version $POM_VERSION."
            exit 1
          fi

        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multi-Platform Image
        env:
          EXTRA_TAGS: ${{ steps.version.outputs.extra_tags }}
        run: |
          mvn -X package -Pproduction \
            -Dquarkus.docker.buildx.platform=linux/amd64,linux/arm64 \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.tag=${{ steps.version.outputs.version }} \
            ${EXTRA_TAGS:+-Dquarkus.container-image.additional-tags=$EXTRA_TAGS} \
            -Dmaven.test.skip=true